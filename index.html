<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee;
    --card-bg: #ffffff;
    --card-border: #e6e2da;
    --text-main: #2b2926;
    --text-sub: #6f6a62;
    --pill-bg: #f0ede6;
    --pill-text: #4a463f;
    --shadow: 0 20px 50px rgba(0,0,0,0.08);
    --script-color: #c9743a;
    --toggle-bg: #ffffff;
    --toggle-border: #ddd8ce;
  }

  [data-theme="dark"] {
    --bg: #16161a;
    --card-bg: #1f1f24;
    --card-border: #2c2c33;
    --text-main: #f2f0eb;
    --text-sub: #9c98a0;
    --pill-bg: #2a2a31;
    --pill-text: #d8d5cf;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
    --script-color: #e58a52;
    --toggle-bg: #26262c;
    --toggle-border: #3a3a42;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text-main);
    transition: background 0.4s ease, color 0.4s ease;
    padding: 24px;
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    box-shadow: var(--shadow);
    transition: background 0.4s ease, border 0.4s ease, transform 0.2s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle:focus-visible { outline: 2px solid var(--script-color); outline-offset: 2px; }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    transition: background 0.4s ease, border 0.4s ease;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--card-border);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name-block { display: flex; flex-direction: column; gap: 8px; }

  .name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 4px 14px;
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--pill-text);
    font-size: 13px;
    font-weight: 600;
  }

  .tagline {
    font-size: 22px;
    letter-spacing: 1px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--card-border);
    margin: 0;
  }

  .signature {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    font-weight: 600;
    color: var(--script-color);
    text-align: center;
    line-height: 1.3;
  }

  .footer-note {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-sub);
    letter-spacing: 0.3px;
  }
</style>
</head>

  <script>
    const toggle = document.getElementById('themeToggle');
    const body = document.body;

    function applyTheme(theme) {
      body.setAttribute('data-theme', theme);
      toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('theme', theme);
    }

    const saved = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(saved);

    toggle.addEventListener('click', () => {
      const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });
  </script>
